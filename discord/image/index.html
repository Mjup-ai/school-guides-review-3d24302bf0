<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>画像の指示書｜確認公開候補</title><style>
:root{font-family:'Hiragino Sans','Yu Gothic',sans-serif;color:#182b45;background:#f1f5fa;font-size:18px;line-height:1.85}*{box-sizing:border-box}body{margin:0}header{background:#173960;color:white;padding:16px max(20px,calc((100vw - 1080px)/2))}main{max-width:1120px;margin:auto;padding:24px 20px 90px}h1{font-size:28px;line-height:1.5}h2{font-size:23px}h3{font-size:20px}a{color:#174b96}button,.button{font:inherit;display:inline-block;border:2px solid #2458a1;border-radius:10px;padding:10px 16px;min-height:48px;color:#174b96;background:white;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid #b56a00;outline-offset:3px}.primary{background:#2458a1;color:white}.card{background:white;border:1px solid #d4deeb;border-radius:16px;padding:24px;margin:18px 0}.note{background:#fff3d8;border-left:5px solid #a35a00;padding:16px;margin:16px 0}.expected{background:#eaf4ed;border-left:5px solid #327147;padding:12px}.help{font-size:16px;color:#4e4051;background:#f7f2f7;padding:10px 14px;margin-top:8px}li{margin:14px 0}ol{padding-left:28px}small,.small{font-size:15px}img{display:block;max-width:100%;height:auto;object-fit:contain}figure{margin:16px 0}figcaption{font-size:15px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}.copytext{white-space:pre-wrap;background:#eef3fa;border:1px solid #cad5e4;padding:16px;font-size:21px;line-height:1.8;overflow-wrap:anywhere}.file{overflow-wrap:anywhere;font-family:monospace}label{display:block;padding:8px}input[type=checkbox]{height:24px;width:24px;vertical-align:middle;margin-right:10px}input[type=text],textarea{font:inherit;max-width:100%;padding:8px;width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{background:#e6edf7;border-radius:6px;padding:3px 8px;font-size:14px}details{margin:16px 0}summary{cursor:pointer;min-height:44px}#status{position:static;background:#fff4cd;border-top:2px solid #a35a00;padding:10px 20px;font-size:15px}dialog{max-width:95vw;max-height:95vh;border:0;padding:16px}dialog::backdrop{background:#000b}dialog img{max-height:80vh}section[id]{scroll-margin-top:20px}@media(max-width:720px){.cols{grid-template-columns:1fr}.card{padding:18px}h1{font-size:25px}main{padding:16px 12px 80px}}@media print{header,#status,button,nav{display:none}.card{break-inside:auto}a{color:inherit}}

#map{position:static!important;inset:auto!important}figure{position:static}nav{position:static}button[data-copy]{position:relative;z-index:1}
</style><header>画像の指示書 <span class="pill" style="color:#173960">確認公開・未完成候補</span></header><main id="app"></main><div id="status" role="status" aria-live="polite">この端末だけに進み具合を記録します。提出の受付記録ではありません。</div><dialog id="zoom"><button onclick="this.parentElement.close()">閉じる</button><img alt="拡大画像"></dialog><script src="data.js"></script><script src="guide.js"></script></html>
